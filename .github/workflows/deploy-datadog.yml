name: deploy-datadog

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-datadog
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}

jobs:
  deploy-datadog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required inputs
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: |
          set -euo pipefail

          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GKE_CLUSTER
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT_EMAIL
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required input: ${name}" >&2
              exit 1
            fi
          done

          test -n "${DATADOG_API_KEY:-}" || (echo "DATADOG_API_KEY GitHub secret is required" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Ensure datadog namespace exists
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace datadog --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update Datadog API secret
        shell: bash
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${DATADOG_API_KEY:-}" || (echo "DATADOG_API_KEY GitHub secret is required" && exit 1)
          kubectl create secret generic datadog-secret \
            --namespace datadog \
            --from-literal=api-key="${DATADOG_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply DatadogAgent manifest
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f k8s/datadog/datadog-agent.yaml

      - name: Verify DatadogAgent resource
        shell: bash
        run: |
          set -euo pipefail
          kubectl get datadogagent datadog -n datadog -o wide
