name: publish-site-web-image

on:
  push:
    branches:
      - main
    paths:
      - "frontend/www/**"
      - ".github/workflows/publish-site-web-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-site-web-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push managed site runtime image
        uses: docker/build-push-action@v6
        with:
          context: frontend/www
          file: frontend/www/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/site-web:latest
            ghcr.io/${{ github.repository_owner }}/site-web:${{ github.sha }}
