apiVersion: batch/v1
kind: Job
metadata:
  name: mbsrn-api-migrate-baseline
  namespace: mbsrn
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: mbsrn-api
      restartPolicy: Never
      containers:
        - name: align
          image: __API_IMAGE__
          command: ["/cnb/process/migrate-baseline-existing"]
          env:
            - name: APP_ENV
              value: production
            - name: DB_CONNECTION_MODE
              value: direct
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mbsrn-api-auth
                  key: DATABASE_URL
          resources:
            requests:
              cpu: __DEPLOY_CPU_REQUEST__
              memory: __DEPLOY_MEMORY_REQUEST__
              ephemeral-storage: __DEPLOY_EPHEMERAL_STORAGE_REQUEST__
            limits:
              cpu: __DEPLOY_CPU_LIMIT__
              memory: __DEPLOY_MEMORY_LIMIT__
              ephemeral-storage: __DEPLOY_EPHEMERAL_STORAGE_LIMIT__
