apiVersion: batch/v1
kind: CronJob
metadata:
  name: mbsrn-seo-competitor-profile-retention
  namespace: mbsrn
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: mbsrn-api
          restartPolicy: Never
          containers:
            - name: retention-cleanup
              image: __API_IMAGE__
              command: ["/cnb/process/seo-competitor-profile-retention"]
              env:
                - name: APP_ENV
                  value: production
                - name: DB_CONNECTION_MODE
                  value: direct
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: mbsrn-api-auth
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                  ephemeral-storage: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
                  ephemeral-storage: "512Mi"
