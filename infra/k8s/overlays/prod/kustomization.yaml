apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mbsrn
resources:
  - namespace.yaml
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: mbsrn-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: production
      - op: replace
        path: /data/NEXT_PUBLIC_API_BASE_URL
        value: https://mbsrn.example.com
      - op: replace
        path: /data/GOOGLE_BUSINESS_PROFILE_REDIRECT_URI
        value: https://mbsrn.example.com/api/integrations/google/business-profile/connect/callback
  - target:
      kind: Ingress
      name: mbsrn-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: mbsrn.example.com
      - op: replace
        path: /metadata/annotations/kubernetes.io~1ingress.global-static-ip-name
        value: mbsrn-prod-static-ip
  - target:
      kind: ManagedCertificate
      name: mbsrn-app-managed-cert
    patch: |-
      - op: replace
        path: /spec/domains/0
        value: mbsrn.example.com
  - target:
      kind: Deployment
      name: mbsrn-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: mbsrn-ui
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
