apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbsrn-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mbsrn-ui
  template:
    metadata:
      labels:
        app: mbsrn-ui
    spec:
      containers:
        - name: ui
          image: us-central1-docker.pkg.dev/PROJECT_ID/mbsrn/ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: mbsrn-config
            - secretRef:
                name: mbsrn-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
