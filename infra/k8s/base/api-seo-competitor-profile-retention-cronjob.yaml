apiVersion: batch/v1
kind: CronJob
metadata:
  name: mbsrn-seo-competitor-profile-retention
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: retention-cleanup
              image: us-central1-docker.pkg.dev/PROJECT_ID/mbsrn/api:latest
              imagePullPolicy: IfNotPresent
              command: ["/cnb/process/seo-competitor-profile-retention"]
              envFrom:
                - configMapRef:
                    name: mbsrn-config
                - secretRef:
                    name: mbsrn-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "250m"
                  memory: "512Mi"
